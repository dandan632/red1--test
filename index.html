    };

    const CITY_DRAWBACKS = {
        "上海": "房价高、落户难，黄梅天有点闷",
        "北京": "通勤距离长，堵车严重，冬天干冷",

        "成都": "冬天雾霾偶尔有，太阳少",
        "广州": "回南天潮湿，夏天太长",
        "深圳": "房价让人望而却步，节奏快压力大",
        "南京": "夏天闷热，冬天湿冷",
        "苏州": "房价上涨快，产业结构偏工业",
        "重庆": "地形爬坡上坎，夏天火炉",
        "西安": "冬天雾霾，工资水平一般",
        "武汉": "夏天太热，城建到处挖",
        "厦门": "房价高收入一般，台风季",
        "青岛": "冬天风大，工资不算高",
        "长沙": "夏天闷热，雨季潮湿",
        "昆明": "紫外线强，工资水平一般",
        "大理": "工作机会少，交通不太方便",
        "天津": "经济活力不如一线，空气有时差",
        "宁波": "房价不低，台风天多",
        "无锡": "产业结构偏制造，夜生活少",
        "珠海": "工资水平一般，物价不低",

        "大连": "冬天海风冷，经济活力一般",
        "合肥": "夏天热，文化娱乐相对少",
        "佛山": "城市面貌较旧，产业偏制造",
        "丽江": "海拔高，医疗教育一般，游客多",
        "东京": "房租贵，通勤拥挤，规矩多",
        "京都": "旅游区人挤人，冬天湿冷",

        "首尔": "竞争压力大，房租不便宜",
        "新加坡": "太热太湿，消费高，车贵",

        "墨尔本": "一天四季，风大",
        "奥克兰": "房价高，工资一般，有点无聊",
        "温哥华": "冬雨绵绵，房价高",
        "多伦多": "冬天冷且长，堵车",
        "伦敦": "阴天多，物价房租贵",
        "爱丁堡": "冬天风大阴冷，城市不大",
        "巴黎": "治安一般，房租贵，效率慢",
        "柏林": "冬天阴冷，租房难",
        "阿姆斯特丹": "房价高，天气多变",
        "苏黎世": "物价极高，生活有点单调",
        "哥本哈根": "冬天日照短，物价高",
        "斯德哥尔摩": "冬天黑得早，房租贵",
        "赫尔辛基": "冬天漫长，社交距离大",
        "维也纳": "有点无聊，排外情绪偶有",
        "布拉格": "旅游区拥挤，工资一般"
    };

    function generateCityDescription(city) {
        const highlight = CITY_HIGHLIGHTS[city] || `${city}的日常很舒服，有自己独特的节奏和味道`;
        const drawback = CITY_DRAWBACKS[city] || "小缺点可能是知名度不高，但生活成本友好";
        const profile = cityProfiles[city];
        let personality = "";
        if (profile[4] >= 2) personality += "喜欢热闹、爱社交的你，";
        else personality += "享受安静、内心丰盈的你，";
        if (profile[9] >= 2) personality += "注重生活便利和城市感，";
        else personality += "偏爱自然和松弛感，";
        if (profile[5] >= 2) personality += "愿意为事业打拼但也需要平衡。";
        else personality += "追求工作与生活的温柔平衡。";
        return `✨ 宜居亮点：${highlight}。\n👤 适合什么样的人：${personality}\n⚠️ 小缺点：${drawback}。\n\n💭 整体来说，${city}是一个可以让人慢慢找到归属感的地方～`;
    }

    let currentQuestionIndex = 0;
    let userAnswers = new Array(15).fill(null);
    let selectedOptionIndex = -1;
    let currentBestCity = '';

    const coverZone = document.getElementById('coverZone');
    const quizZone = document.getElementById('quizZone');
    const resultZone = document.getElementById('resultZone');
    const startBtn = document.getElementById('startBtn');
    const nextBtn = document.getElementById('nextBtn');
    const restartBtn = document.getElementById('restartBtn');
    const shareBtn = document.getElementById('shareBtn');
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const progressText = document.getElementById('progressText');
    const progressFill = document.getElementById('progressFill');
    const resultCityName = document.getElementById('resultCityName');
    const resultDesc = document.getElementById('resultDesc');
    const toast = document.getElementById('toast');

    function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => { toast.classList.remove('show'); }, 1800);
    }

    function startQuiz() {
        coverZone.style.display = 'none';
        quizZone.style.display = 'flex';
        resultZone.style.display = 'none';
        currentQuestionIndex = 0;
        userAnswers = new Array(15).fill(null);
        selectedOptionIndex = -1;
        renderQuestion(0);
    }

    function renderQuestion(index) {
        const q = QUESTIONS[index];
        questionText.textContent = q.text;
        progressText.textContent = `${index + 1} / ${QUESTIONS.length}`;
        progressFill.style.width = `${(index / QUESTIONS.length) * 100}%`;
        selectedOptionIndex = -1;
        nextBtn.disabled = true;
        optionsContainer.innerHTML = '';
        q.options.forEach((opt, optIdx) => {
            const div = document.createElement('div');
            div.className = 'option-item';
            div.textContent = opt.label;
            div.dataset.optIndex = optIdx;
            div.addEventListener('click', () => {
                document.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
                div.classList.add('selected');
                selectedOptionIndex = optIdx;
                nextBtn.disabled = false;
            });
            optionsContainer.appendChild(div);
        });
    }

    function handleNext() {
        if (selectedOptionIndex === -1) return;
        const q = QUESTIONS[currentQuestionIndex];
        userAnswers[currentQuestionIndex] = q.options[selectedOptionIndex].value;
        if (currentQuestionIndex < QUESTIONS.length - 1) {
            currentQuestionIndex++;
            renderQuestion(currentQuestionIndex);
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        const userVector = userAnswers;
        let minDistance = Infinity;
        let bestCity = CITIES[0];
        for (let city of CITIES) {
            const profile = cityProfiles[city];
            let dist = 0;
            for (let i = 0; i < 15; i++) {
                dist += Math.abs(userVector[i] - profile[i]);
            }
            if (dist < minDistance) {
                minDistance = dist;
                bestCity = city;
            }
        }
        currentBestCity = bestCity;
        displayResult(bestCity);
    }

    function displayResult(city) {
        quizZone.style.display = 'none';
        resultZone.style.display = 'flex';
        coverZone.style.display = 'none';
        resultCityName.textContent = city;
        resultDesc.textContent = generateCityDescription(city);
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        userAnswers = new Array(15).fill(null);
        selectedOptionIndex = -1;
        coverZone.style.display = 'flex';
        quizZone.style.display = 'none';
        resultZone.style.display = 'none';
        progressText.textContent = `1 / ${QUESTIONS.length}`;
        progressFill.style.width = `0%`;
        nextBtn.disabled = true;
    }

    function shareResult() {
        if (!currentBestCity) return;
        const text = `我的本命定居城市是【${currentBestCity}】！\n${generateCityDescription(currentBestCity)}\n\n#本命定居城市 #宜居城市测试 #心理测试`;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('已复制分享文案 ✨');
            }).catch(() => {
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            showToast('已复制分享文案 ✨');
        } catch (e) {
            showToast('复制失败，请手动截图分享');
        }
        document.body.removeChild(textarea);
    }

    startBtn.addEventListener('click', startQuiz);
    nextBtn.addEventListener('click', handleNext);
    restartBtn.addEventListener('click', restartQuiz);
    shareBtn.addEventListener('click', shareResult);

    coverZone.style.display = 'flex';
    quizZone.style.display = 'none';
    resultZone.style.display = 'none';
</script>
